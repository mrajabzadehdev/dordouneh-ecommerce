<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>پرداخت سفارش - دردونه</title>

    <link
        rel="stylesheet"
        href="E-commerce-New/css/payment.css"
    >

</head>


<body>


<main class="payment-page">

    <div class="payment-container">


        <!-- =====================================================
             HEADER
        ====================================================== -->

        <header class="payment-header">

            <div class="brand">

                <div class="brand-icon">
                    <span>د</span>
                </div>

                <div class="brand-text">

                    <h1>دردونه</h1>

                    <span>
                        درگاه پرداخت
                    </span>

                </div>

            </div>


            <div class="secure-badge">

                <span class="secure-icon">
                    ✓
                </span>

                <span>
                    پرداخت امن
                </span>

            </div>

        </header>



        <!-- =====================================================
             PAYMENT TITLE
        ====================================================== -->

        <section class="payment-title">

            <div class="title-icon">
                💳
            </div>

            <div>

                <h2>
                    پرداخت سفارش
                </h2>

                <p>
                    اطلاعات کارت بانکی خود را وارد کنید
                </p>

            </div>

        </section>



        <!-- =====================================================
             ORDER AMOUNT
        ====================================================== -->

        <section class="order-info">

            <div class="amount-label">

                <span class="amount-icon">
                    ◉
                </span>

                <span>
                    مبلغ قابل پرداخت
                </span>

            </div>


            <strong id="payment-amount">
                ۰ تومان
            </strong>

        </section>



        <!-- =====================================================
             CARD PREVIEW
        ====================================================== -->

        <div class="card-preview">

            <div class="card-top">

                <span class="card-chip"></span>

                <span class="card-type">
                    BANK
                </span>

            </div>


            <div
                class="card-number-preview"
                id="card-number-preview"
            >
                •••• &nbsp; •••• &nbsp; •••• &nbsp; ••••
            </div>


            <div class="card-bottom">

                <span>
                    درگاه پرداخت دردونه
                </span>

                <span>
                    BANK CARD
                </span>

            </div>

        </div>



        <!-- =====================================================
             CARD FORM
        ====================================================== -->

        <section class="card-section">


            <div class="section-heading">

                <h3>
                    اطلاعات کارت بانکی
                </h3>

                <span>
                    ●
                </span>

            </div>



            <!-- CARD NUMBER -->

            <div class="form-group">

                <label for="card-number">
                    شماره کارت
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        ▣
                    </span>

                    <input
                        type="text"
                        id="card-number"
                        maxlength="19"
                        placeholder="---- ---- ---- ----"
                        inputmode="numeric"
                        autocomplete="cc-number"
                    >

                </div>

            </div>



            <!-- CVV + EXPIRY -->

            <div class="form-row">


                <div class="form-group">

                    <label for="cvv2">
                        CVV2
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ▤
                        </span>

                        <input
                            type="text"
                            id="cvv2"
                            maxlength="4"
                            placeholder="CVV2"
                            inputmode="numeric"
                            autocomplete="cc-csc"
                        >

                    </div>

                </div>



                <div class="form-group">

                    <label for="expire-date">
                        تاریخ انقضا
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ▦
                        </span>

                        <input
                            type="text"
                            id="expire-date"
                            maxlength="5"
                            placeholder="MM/YY"
                            inputmode="numeric"
                            autocomplete="cc-exp"
                        >

                    </div>

                </div>


            </div>



            <!-- OTP -->

            <div class="form-group">

                <div class="label-row">

                    <label for="second-password">
                        رمز پویا
                    </label>

                    <span class="otp-hint">
                        رمز پیامک‌شده
                    </span>

                </div>


                <div class="input-wrapper otp-wrapper">

                    <span class="input-icon">
                        ⌁
                    </span>

                    <input
                        type="text"
                        id="second-password"
                        maxlength="6"
                        placeholder="رمز پویا را وارد کنید"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                    >

                </div>

            </div>



            <!-- =================================================
                 PAY BUTTON
            ================================================== -->

            <button
                type="button"
                id="pay-button"
            >

                <span class="pay-button-text">
                    پرداخت
                </span>

                <span class="button-arrow">
                    ←
                </span>

            </button>



            <!-- =================================================
                 CANCEL
            ================================================== -->

            <button
                type="button"
                id="cancel-payment"
            >
                انصراف و بازگشت
            </button>


        </section>



        <!-- =====================================================
             FOOTER
        ====================================================== -->

        <footer class="payment-footer">


            <div class="security-item">

                <span>
                    🔒
                </span>

                <span>
                    اطلاعات شما محفوظ است
                </span>

            </div>


            <div class="footer-divider"></div>


            <div class="security-item">

                <span>
                    ✓
                </span>

                <span>
                    تراکنش امن
                </span>

            </div>


        </footer>


    </div>

</main>


<script src="E-commerce-New/js/payment.js"></script>

</body>

</html>
