<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ورود و ثبت نام | دردونه</title>

  <link rel="stylesheet" href="E-commerce-New/css/auth.css">
</head>

<body>

  <main class="auth-page">

    <div class="auth-box">

      <!-- ========================= -->
      <!-- لوگو -->
      <!-- ========================= -->

      <div>
        <img
          class="dordou"
          src="E-commerce-New/images/dordouneh.jpg"
          alt="dordouneh"
        >
      </div>

      <p class="auth-welcome">
        به دردونه خوش آمدید
      </p>


      <!-- ========================= -->
      <!-- انتخاب ورود / ثبت نام -->
      <!-- ========================= -->

      <div class="auth-tabs">

        <button
          type="button"
          class="auth-tab active"
          id="loginTab"
        >
          ورود
        </button>

        <button
          type="button"
          class="auth-tab"
          id="registerTab"
        >
          ثبت نام
        </button>

      </div>


      <!-- ========================= -->
      <!-- فرم ورود -->
      <!-- ========================= -->

      <form id="loginForm" class="auth-form">

        <h1>
          ورود به حساب کاربری
        </h1>


        <div class="form-group">

          <label for="loginMobile">
            شماره موبایل
          </label>

          <input
            type="tel"
            id="loginMobile"
            name="loginMobile"
            placeholder="09123456789 مثال"
            autocomplete="tel"
          >

        </div>


        <div class="form-group">

          <label for="loginPassword">
            رمز عبور
          </label>

          <input
            type="password"
            id="loginPassword"
            name="loginPassword"
            autocomplete="current-password"
          >

        </div>


        <!-- فراموشی رمز -->

        <div class="forgot-password">

          <a
            href="#"
            id="forgotPassword"
          >
            رمز عبور را فراموش کرده‌اید؟
          </a>

        </div>


        <div
          id="loginMessage"
          class="auth-message"
        ></div>


        <button
          type="submit"
          class="auth-button"
          id="loginbtn"
        >
          ورود
        </button>

      </form>


      <!-- ========================= -->
      <!-- فرم ثبت نام -->
      <!-- ========================= -->

      <form
        id="registerForm"
        class="auth-form hidden"
      >

        <h1>
          ایجاد حساب کاربری
        </h1>


        <div class="form-group">

          <label for="registerName">
            نام و نام خانوادگی
          </label>

          <input
            type="text"
            id="registerName"
            name="registerName"
            autocomplete="name"
          >

        </div>


        <div class="form-group">

          <label for="registerMobile">
            شماره موبایل
          </label>

          <input
            type="tel"
            id="registerMobile"
            name="registerMobile"
            placeholder="09123456789 مثال"
            autocomplete="tel"
          >

        </div>


        <div class="form-group">

          <label for="registerPassword">
            رمز عبور
          </label>

          <input
            type="password"
            id="registerPassword"
            name="registerPassword"
            autocomplete="new-password"
          >

        </div>


        <div class="form-group">

          <label for="confirmPassword">
            تکرار رمز عبور
          </label>

          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            autocomplete="new-password"
          >

        </div>


        <div
          id="registerMessage"
          class="auth-message"
        ></div>


        <button
          type="submit"
          class="auth-button"
          id="registerbtn"
        >
          ثبت نام
        </button>

      </form>


      <!-- ========================= -->
      <!-- فرم بازیابی رمز عبور -->
      <!-- ========================= -->

      <form
        id="forgotForm"
        class="auth-form hidden"
      >

        <h1>
          بازیابی رمز عبور
        </h1>


        <!-- شماره موبایل -->

        <div class="form-group">

          <label for="forgotMobile">
            شماره موبایل
          </label>

          <input
            type="tel"
            id="forgotMobile"
            name="forgotMobile"
            placeholder="09123456789 مثال"
            autocomplete="tel"
          >

        </div>


        <!-- رمز عبور جدید -->

        <div class="form-group">

          <label for="fnewPassword">
            رمز عبور جدید
          </label>

          <input
            type="password"
            id="fnewPassword"
            name="fnewPassword"
            autocomplete="new-password"
          >

        </div>


        <!-- تکرار رمز عبور جدید -->

        <div class="form-group">

          <label for="fconfirmNewPassword">
            تکرار رمز عبور جدید
          </label>

          <input
            type="password"
            id="fconfirmNewPassword"
            name="fconfirmNewPassword"
            autocomplete="new-password"
          >

        </div>


        <div
          id="forgotMessage"
          class="auth-message"
        ></div>


        <!-- تغییر رمز -->

        <button
          type="submit"
          class="auth-button"
          id="changePassword"
        >
          تغییر رمز عبور
        </button>

      </form>


      <!-- ========================= -->
      <!-- بازگشت به فروشگاه -->
      <!-- ========================= -->

      <div class="back-home">

        <a href="index.html">
          ← بازگشت به فروشگاه
        </a>

      </div>

    </div>

  </main>


  <!-- ========================= -->
  <!-- JavaScript -->
  <!-- ========================= -->

  <script src="E-commerce-New/js/auth.js"></script>

</body>

</html>
